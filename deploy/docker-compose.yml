# ============================================================
# 尚庭公寓后端服务编排
# 前提：MySQL (mysql8) / Nacos (nacos) / Redis (redis) 三个容器
#       已在外部 Docker 网络 nacos-net 上运行
# 使用方式：
#   开发环境: docker compose up -d      # 默认读 .env.dev
#   本地调试: docker compose --env-file .env.local up -d
# ============================================================

services:
  # ===== Gateway (8088) =====
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: jars/gateway-1.0-SNAPSHOT.jar
    image: shangting/gateway:latest
    container_name: gateway
    ports:
      - "8088:8088"
    env_file:
      - .env.dev
    # Gateway 只有 Nacos 连接，无需 MySQL/Redis，但 env_file 会一并注入（不报错）
    networks:
      - nacos-net
    restart: unless-stopped
    # 等 Nacos 就绪再启动
    depends_on:
      - nacos-check
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===== service-user (8082) =====
  service-user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: jars/service-user-1.0-SNAPSHOT.jar
    image: shangting/service-user:latest
    container_name: service-user
    ports:
      - "8082:8082"
    env_file:
      - .env.dev
    networks:
      - nacos-net
    restart: unless-stopped
    depends_on:
      - nacos-check
      - mysql-check
      - redis-check

  # ===== service-apartment (8083) =====
  service-apartment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: jars/service-apartment-1.0-SNAPSHOT.jar
    image: shangting/service-apartment:latest
    container_name: service-apartment
    ports:
      - "8083:8083"
    env_file:
      - .env.dev
    networks:
      - nacos-net
    restart: unless-stopped
    depends_on:
      - nacos-check
      - mysql-check
      - redis-check

  # ===== service-lease (8084) =====
  service-lease:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: jars/service-lease-1.0-SNAPSHOT.jar
    image: shangting/service-lease:latest
    container_name: service-lease
    ports:
      - "8084:8084"
    env_file:
      - .env.dev
    networks:
      - nacos-net
    restart: unless-stopped
    depends_on:
      - nacos-check
      - mysql-check
      - redis-check

  # ===== rentHouseAdmin 管理端前端 (80 → Nginx) =====
  web-admin:
    build:
      context: ./web/admin
      dockerfile: Dockerfile.nginx
    image: shangting/web-admin:latest
    container_name: web-admin
    ports:
      - "80:80"
    networks:
      - nacos-net
    restart: unless-stopped
    depends_on:
      - gateway
    # 彻底放开限制 —— CentOS 7 + strict SELinux + seccomp 都拦
    privileged: true
    command: ["nginx", "-g", "daemon off; pid /tmp/nginx.pid;"]

  # ===== rentHouseH5 用户端前端 (81 → Nginx) =====
  web-h5:
    build:
      context: ./web/h5
      dockerfile: Dockerfile.nginx
    image: shangting/web-h5:latest
    container_name: web-h5
    ports:
      - "81:80"
    networks:
      - nacos-net
    restart: unless-stopped
    depends_on:
      - gateway
    privileged: true
    command: ["nginx", "-g", "daemon off; pid /tmp/nginx.pid;"]

  # ===== 健康检查辅助容器 —— 确保外部依赖就绪后再启动业务服务 =====
  nacos-check:
    image: busybox:latest
    container_name: nacos-check
    networks:
      - nacos-net
    command: >
      sh -c "echo 'Waiting for Nacos...';
      until wget -q --spider http://nacos:8848/nacos/actuator/health; do
        echo 'Nacos not ready, retrying in 3s...'; sleep 3;
      done;
      echo 'Nacos is ready!'"
    restart: "no"

  mysql-check:
    image: busybox:latest
    container_name: mysql-check
    networks:
      - nacos-net
    command: >
      sh -c "echo 'Waiting for MySQL...';
      until wget -q -O - mysql8:3306 >/dev/null 2>&1; do
        echo 'MySQL not ready, retrying in 3s...'; sleep 3;
      done;
      echo 'MySQL is ready!'"
    restart: "no"

  redis-check:
    image: busybox:latest
    container_name: redis-check
    networks:
      - nacos-net
    command: >
      sh -c "echo 'Waiting for Redis...';
      until wget -q -O - redis:6379 >/dev/null 2>&1; do
        echo 'Redis not ready, retrying in 3s...'; sleep 3;
      done;
      echo 'Redis is ready!'"
    restart: "no"

# ===== 外部网络 —— 基础设施容器已在这个网络上 =====
networks:
  nacos-net:
    external: true
