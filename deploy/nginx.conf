# ============================================================
# 尚庭公寓 - 宿主机 Nginx 配置
# 用法：将本文件 / 软链到 nginx/conf/conf.d/shangting.conf
#   1. 确认 Gateway 容器端口 8088 已映射到宿主机
#   2. 修改下面 root 路径为你的前端 dist 实际存放位置
#   3. nginx -t && nginx -s reload
# ============================================================

# ========== 管理端 rentHouseAdmin :80 ==========
server {
    listen 80;
    server_name _;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # —— 静态文件目录（改成你实际放 dist 的路径）——
    root /opt/shangting/deploy/web/admin/dist;
    index index.html;

    # —— API 反代 /admin/** → Gateway 容器 ——
    # Gateway 容器已映射 8088 到宿主机，直接走 localhost
    location /admin {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # —— SPA 路由回退 ——
    # 所有非 /admin 开头的请求（含浏览器刷新子路由）→ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— 静态资源缓存 7 天 ——
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ========== 用户端 rentHouseH5 :81 ==========
server {
    listen 81;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # —— 静态文件目录 ——
    root /opt/shangting/deploy/web/h5/dist;
    index index.html;

    # —— API 反代 /app/** → Gateway ——
    location /app {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # —— SPA 路由回退 ——
    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— 静态资源缓存 ——
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

