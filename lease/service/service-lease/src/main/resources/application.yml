server:
  port: 8084

spring:
  application:
    name: service-lease
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:192.168.100.101}:${NACOS_PORT:8848}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://${MYSQL_HOST:192.168.100.101}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lease}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 12
      minimum-idle: 10
      pool-name: SPHHikariPool
  jackson:
    time-zone: GMT+8
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.101}
      port: ${REDIS_PORT:6379}
      database: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
